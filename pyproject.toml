[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-diff"
version = "0.1.0"
description = "Pixel-level geometric difference detection between approved PDFs and scanned documents."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=9.0.0",
    "opencv-contrib-python>=4.9",
    "PyMuPDF>=1.24",
    "pypdfium2>=5.0",
    "PyYAML>=6.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
ocr = [
    "rapidocr-onnxruntime>=1.4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
